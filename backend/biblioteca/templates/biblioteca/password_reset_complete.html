{% extends 'biblioteca/base.html' %}
{% load static %}
{% block title %}Contraseña actualizada · Biblioteca Córdoba{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'biblioteca/css/password_reset_complete.css' %}">
{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-mark auth-mark--centered">✓</div>
    <h1>Contraseña actualizada</h1>
    <p class="text-muted">Ya podés iniciar sesión con tu nueva contraseña.</p>
    <a class="btn btn-primary mt-3" href="{% url 'login' %}">Iniciar sesión</a>
  </div>
</section>
{% endblock %}
